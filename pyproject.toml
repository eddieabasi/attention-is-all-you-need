[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer"
version = "0.1.0"
description = "From-scratch implementation of 'Attention Is All You Need' (Vaswani et al., 2017)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "sentencepiece>=0.2",
    "sacrebleu>=2.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["transformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds on CPU"]
